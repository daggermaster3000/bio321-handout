name: Build and deploy handout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r site/requirements.txt
      - name: Install fonts for the PDF
        # Charis SIL stands in for Charter, which the page asks for first.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-sil-charis fonts-liberation
      - name: Build site and PDFs
        run: python site/build.py --pdf
      - name: Check the PDFs were made
        run: test -s site/BIO321-handout.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
