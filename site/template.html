<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<style>
:root{
  --paper:#ffffff;
  --ink:#1a1a1a;
  --ink-soft:#424242;
  --ink-faint:#6b6b6b;
  --rule:#d4d4d4;
  --rule-soft:#e8e8e8;
  --link:#14507d;
  --draft:#8a5a00;
  --draft-soft:#fbf6ec;
  --ch-405:#2f57c4;
  --ch-488:#127a3d;
  --ch-561:#b06012;
  --ch-647:#9c2a85;
  --serif:Charter,"Bitstream Charter","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.6;
}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--link)}
a:focus-visible,button:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* ---------- reading progress ---------- */
.progress{
  position:fixed;top:0;left:0;right:0;height:2px;
  background:var(--rule-soft);
  z-index:10;
}
.progress > span{
  display:block;height:100%;width:0;
  background:var(--ink);
  transform-origin:0 50%;
}

/* ---------- shell ---------- */
.shell{max-width:1100px;margin:0 auto;padding-block:0 80px;padding-inline:20px}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:2px solid var(--ink);
  padding:36px 0 20px;
}
.eyebrow{
  font-family:var(--sans);
  font-size:12.5px;letter-spacing:.04em;
  color:var(--ink-faint);margin:0 0 10px;
}
h1{
  font-size:clamp(26px,4vw,36px);
  font-weight:700;line-height:1.15;
  margin:0;max-width:26ch;
}
h1 em{font-style:italic;font-weight:700}
h1 code{background:none;padding:0;font-size:.9em}
.masthead .sub{margin:10px 0 0;color:var(--ink-soft);font-size:16.5px;max-width:48ch}
/* ---------- draft notice ---------- */
.notice{
  margin:22px 0 0;padding:10px 14px;
  background:var(--draft-soft);color:var(--draft);
  border:1px solid #e6d9bd;
  font-family:var(--sans);font-size:13.5px;line-height:1.5;
}
.notice strong{font-weight:600}

/* ---------- body grid ---------- */
.layout{display:grid;grid-template-columns:1fr;gap:0;margin-top:32px}
@media (min-width:940px){
  .layout{grid-template-columns:220px minmax(0,1fr);gap:52px;align-items:start}
}

/* ---------- contents rail ---------- */
.contents{
  font-family:var(--sans);
  font-size:13.5px;line-height:1.4;
  border-top:1px solid var(--rule);padding-top:16px;
}
@media (min-width:940px){
  .contents{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;
    border-top:none;border-right:1px solid var(--rule-soft);padding:2px 18px 2px 0}
}
.contents h2{
  font-family:var(--sans);
  font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 12px;
}
.contents ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.contents > ol > li > a{
  display:grid;grid-template-columns:1.5em 1fr;gap:6px;
  padding:4px 0;text-decoration:none;color:var(--ink-soft);
}
.contents > ol > li > a:hover{text-decoration:underline}
.contents > ol > li > a.trail{color:var(--ink)}
.contents > ol > li > a.active{color:var(--ink);font-weight:600}
.contents > ol > li > a.active .num{color:var(--ink)}
.contents .num{color:var(--ink-faint);font-variant-numeric:tabular-nums;font-size:12.5px}
.contents ol ol{margin:0 0 7px 1.5em;padding:0 0 0 9px;border-left:1px solid var(--rule-soft);gap:0}
.contents ol ol a{
  display:block;position:relative;padding:2px 0;
  color:var(--ink-faint);text-decoration:none;font-size:12.5px;
}
.contents ol ol a:hover{text-decoration:underline}
.contents ol ol a.active{color:var(--ink);font-weight:600}
/* sits on top of the rule that runs down the sub-list */
.contents ol ol a.active::before{
  content:"";position:absolute;left:-10px;top:0;bottom:0;width:2px;
  background:var(--ink);
}

/* ---------- prose ---------- */
.prose{max-width:70ch;min-width:0;overflow-wrap:break-word}
.prose > section{padding:0 0 6px;scroll-margin-top:18px}
.prose > section + section{margin-top:46px;border-top:1px solid var(--rule);padding-top:30px}

h2.sec{
  font-size:clamp(23px,2.6vw,27px);font-weight:700;line-height:1.25;
  margin:0 0 16px;display:grid;grid-template-columns:1.9em 1fr;gap:8px;align-items:baseline;
}
h2.sec .num{color:var(--ink-faint);font-size:.7em;font-weight:400;font-variant-numeric:tabular-nums}
.prose h2:not(.sec){font-size:20px;font-weight:700;margin:32px 0 8px;line-height:1.3}
h3{font-size:18px;font-weight:700;margin:30px 0 7px}
h4{
  font-family:var(--sans);
  font-size:14px;font-weight:600;margin:20px 0 5px;color:var(--ink-soft);
}
.prose p{margin:0 0 13px}
.prose ul,.prose ol{margin:0 0 13px;padding-left:1.35em}
.prose li{margin:0 0 5px}
.lede{font-size:18px}
.prose em{font-style:italic}
.prose strong{font-weight:700}
blockquote{
  margin:16px 0;padding:2px 0 2px 16px;
  border-left:3px solid var(--rule);color:var(--ink-soft);
}
code{font-family:var(--mono);font-size:.87em;background:#f4f4f4;padding:1px 4px;border-radius:2px}
pre{
  font-family:var(--mono);font-size:13px;line-height:1.5;
  background:#f7f7f7;border:1px solid var(--rule-soft);
  padding:12px 14px;overflow-x:auto;
}
pre code{background:none;padding:0;font-size:inherit}
hr{border:0;border-top:1px solid var(--rule);margin:26px 0}

/* placeholder lines */
.todo{
  font-family:var(--sans);
  font-size:13px;color:var(--ink-faint);
  border:1px dashed var(--rule);
  padding:9px 12px;margin:8px 0 4px;
}
.todo::before{content:"To be written — ";color:var(--draft)}

/* ---------- maths ---------- */
.mathblock{
  margin:16px 0;padding:2px 0;
  overflow-x:auto;overflow-y:hidden;
  text-align:center;
}
.katex{font-size:1.03em}
.katex-display{margin:0}

/* ---------- figures ---------- */
.prose{counter-reset:figure}
figure{
  margin:24px 0;max-width:100%;
  display:flex;flex-direction:column;gap:8px;
  break-inside:avoid;page-break-inside:avoid;
}
figure img{
  display:block;width:100%;height:auto;
  border:1px solid var(--rule);
}
figure.plate img{border:none}
figcaption{
  counter-increment:figure;
  font-family:var(--sans);
  font-size:13px;line-height:1.5;color:var(--ink-soft);
  max-width:64ch;
}
figcaption::before{content:"Figure " counter(figure) ". ";font-weight:600;color:var(--ink)}
figcaption em{font-style:italic}
figcaption .scale{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.figrow{display:grid;gap:18px;grid-template-columns:1fr;margin:24px 0}
@media (min-width:620px){.figrow{grid-template-columns:1fr 1fr}}
.figrow figure{margin:0}

/* ---------- tables ---------- */
.tablewrap,.channels{
  margin:16px 0;max-width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
table{
  border-collapse:collapse;width:100%;
  font-family:var(--sans);font-size:13px;line-height:1.45;
}
caption{
  text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-faint);padding-bottom:8px;font-weight:600;
}
th,td{
  text-align:left;vertical-align:top;
  padding:7px 14px 7px 0;
  border-bottom:1px solid var(--rule-soft);
  overflow-wrap:break-word;
}
thead th{border-bottom:1px solid var(--rule)}
th{font-weight:600;color:var(--ink-soft);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
td.nm{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
/* blank cells students fill in by hand */
td:empty{min-width:10ch}
td:empty::after{content:"";display:block;height:1.1em;border-bottom:1px solid var(--rule)}

/* ---------- print ---------- */
@media print{
  :root{
    --ink:#000;--ink-soft:#2b2b2b;--ink-faint:#555;
    --rule:#999;--rule-soft:#ccc;--link:#000;--draft:#444;--draft-soft:#fff;
  }
  body{font-size:10pt;line-height:1.45}
  .shell{max-width:none;padding:0}
  .layout{display:block;margin-top:0}
  .contents{break-after:page;page-break-after:always;font-size:9.5pt;border:none;padding:0;
    position:static;max-height:none;overflow:visible}
  .contents ol ol{display:block}
  .prose{max-width:none}
  .prose > section{break-inside:auto}
  .prose > section + section{margin-top:22pt;padding-top:14pt}
  h1,h2.sec,h3,h4{break-after:avoid;page-break-after:avoid}
  .tablewrap,.channels,.mathblock,pre{overflow:visible}
  table{font-size:9pt;table-layout:fixed}
  th,td{padding:4pt 8pt 4pt 0}
  .todo{border-color:#bbb}
  td:empty::after{height:1.5em;border-bottom:1px solid #888}
  figure{max-width:100%}
  figure img{border-color:#999;max-height:19cm;object-fit:contain}
  figcaption{color:#222;font-size:8.5pt}
  .figrow{gap:10px}
  a{color:#000;text-decoration:none}
  .notice{border:1px solid #bbb}
  .progress{display:none}
  .contents a.active,.contents a.trail{font-weight:400;color:#000}
  .contents ol ol a.active::before{display:none}
  @page{margin:18mm 16mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><span></span></div>
<div class="shell">

<header class="masthead">
{{EYEBROW}}
  <h1>{{HEADING}}</h1>
{{SUBTITLE}}
</header>

{{NOTICE}}

<div class="layout">
  <nav class="contents" aria-label="Contents">
    <h2>Contents</h2>
{{TOC}}
  </nav>
  <main class="prose">
{{CONTENT}}
  </main>
</div>
</div>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
<script>
// Reading progress: how far the bottom of the viewport has moved through the page.
(function () {
  var bar = document.querySelector(".progress > span");
  var rail = document.querySelector(".contents");
  var links = rail ? [].slice.call(rail.querySelectorAll('a[href^="#"]')) : [];
  var marks = links
    .map(function (a) {
      return {link: a, el: document.getElementById(decodeURIComponent(a.hash.slice(1)))};
    })
    .filter(function (m) { return m.el; });
  var current = null;
  var queued = false;

  // The heading nearest above the top of the viewport is the one being read.
  function spy() {
    if (!marks.length) return;
    var active = marks[0];
    for (var i = 0; i < marks.length; i++) {
      if (marks[i].el.getBoundingClientRect().top > 120) break;
      active = marks[i];
    }
    // At the foot of the page the last headings never reach the top of the
    // viewport, so hand the last one the highlight once we can go no further.
    var doc = document.documentElement;
    if (window.scrollY + window.innerHeight >= doc.scrollHeight - 2) {
      active = marks[marks.length - 1];
    }
    if (active === current) return;
    current = active;
    links.forEach(function (a) {
      a.classList.remove("active", "trail");
      a.removeAttribute("aria-current");
    });
    active.link.classList.add("active");
    active.link.setAttribute("aria-current", "location");
    var parent = active.link.closest("ol ol");
    if (parent) {
      var owner = parent.parentElement.querySelector(":scope > a");
      if (owner) owner.classList.add("trail");
    }
    keepVisible(active.link);
  }

  // Follow along inside the rail when it has its own scrollbar.
  function keepVisible(link) {
    if (rail.scrollHeight <= rail.clientHeight) return;
    var top = link.offsetTop;
    var bottom = top + link.offsetHeight;
    if (top < rail.scrollTop) rail.scrollTop = top - 8;
    else if (bottom > rail.scrollTop + rail.clientHeight) {
      rail.scrollTop = bottom - rail.clientHeight + 8;
    }
  }

  function update() {
    queued = false;
    if (bar) {
      var scrollable = document.documentElement.scrollHeight - window.innerHeight;
      var ratio = scrollable > 0 ? window.scrollY / scrollable : 1;
      bar.style.width = Math.min(1, Math.max(0, ratio)) * 100 + "%";
    }
    spy();
  }
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(update);
  }
  window.addEventListener("scroll", schedule, {passive: true});
  window.addEventListener("resize", schedule);
  document.addEventListener("DOMContentLoaded", update);
  window.addEventListener("load", update);  // images settle the page height
  update();
})();

document.addEventListener("DOMContentLoaded", function () {
  if (!window.renderMathInElement) return;
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false
  });
});
</script>
</body>
</html>
