<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  --paper:#f6f7f5;
  --surface:#ffffff;
  --ink:#171c1b;
  --ink-soft:#4a5553;
  --ink-faint:#7c8785;
  --rule:#dfe3df;
  --rule-soft:#ebeeea;
  --accent:#0f6b6b;
  --accent-soft:#e3efee;
  --draft:#a8580f;
  --draft-soft:#fbf0e2;
  --ch-405:#4a6fe3;
  --ch-488:#1f9d55;
  --ch-561:#c9761a;
  --ch-647:#b5359b;
  --shadow:0 1px 2px rgba(20,30,28,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101413;
    --surface:#171d1c;
    --ink:#e7ecea;
    --ink-soft:#a8b3b0;
    --ink-faint:#7d8987;
    --rule:#2b3433;
    --rule-soft:#212927;
    --accent:#5fc8bf;
    --accent-soft:#1a2c2b;
    --draft:#e0a35e;
    --draft-soft:#2a2118;
    --ch-405:#89a3f5;
    --ch-488:#4fc98a;
    --ch-561:#e9a45c;
    --ch-647:#e07fce;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#101413;
  --surface:#171d1c;
  --ink:#e7ecea;
  --ink-soft:#a8b3b0;
  --ink-faint:#7d8987;
  --rule:#2b3433;
  --rule-soft:#212927;
  --accent:#5fc8bf;
  --accent-soft:#1a2c2b;
  --draft:#e0a35e;
  --draft-soft:#2a2118;
  --ch-405:#89a3f5;
  --ch-488:#4fc98a;
  --ch-561:#e9a45c;
  --ch-647:#e07fce;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 24px 96px}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--rule);
  padding:40px 0 26px;
  display:flex;
  flex-wrap:wrap;
  gap:28px 40px;
  align-items:flex-end;
  justify-content:space-between;
}
.eyebrow{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px;
}
h1{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:clamp(28px,4.2vw,42px);
  font-weight:700;line-height:1.12;letter-spacing:-.02em;
  margin:0;max-width:16ch;text-wrap:balance;
}
h1 em{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:500}
.masthead .sub{
  margin:12px 0 0;color:var(--ink-soft);font-size:17px;max-width:44ch;
}
.facts{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  display:grid;grid-template-columns:auto auto;gap:4px 22px;
  font-size:13px;align-content:end;
}
.facts dt{color:var(--ink-faint);letter-spacing:.04em}
.facts dd{margin:0;font-weight:500}
.facts dd i{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400}

/* ---------- draft notice ---------- */
.notice{
  margin:26px 0 0;padding:12px 16px;
  background:var(--draft-soft);color:var(--draft);
  border-left:3px solid var(--draft);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:13.5px;line-height:1.5;
}
.notice strong{font-weight:600}

/* ---------- body grid ---------- */
.layout{display:grid;grid-template-columns:1fr;gap:0;margin-top:38px}
@media (min-width:940px){
  .layout{grid-template-columns:232px minmax(0,1fr);gap:56px;align-items:start}
}

/* ---------- contents rail ---------- */
.contents{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:14px;line-height:1.4;
  border-top:1px solid var(--rule);padding-top:18px;
}
@media (min-width:940px){
  .contents{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;border-top:none;padding-top:4px}
}
.contents h2{
  font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 14px;
}
.contents ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.contents > ol > li > a{
  display:grid;grid-template-columns:1.6em 1fr;gap:6px;
  padding:5px 6px 5px 0;text-decoration:none;color:var(--ink);
  border-radius:3px;
}
.contents > ol > li > a:hover{color:var(--accent)}
.contents .num{color:var(--ink-faint);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.contents ol ol{margin:0 0 8px 1.6em;padding:0 0 0 8px;border-left:1px solid var(--rule-soft);gap:0}
.contents ol ol a{display:block;padding:3px 0;color:var(--ink-soft);text-decoration:none;font-size:13px}
.contents ol ol a:hover{color:var(--accent)}

/* ---------- prose ---------- */
.prose{max-width:68ch;min-width:0}
.prose > section{padding:0 0 8px;scroll-margin-top:20px}
.prose > section + section{margin-top:52px;border-top:1px solid var(--rule);padding-top:34px}

h2.sec{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:clamp(22px,2.6vw,27px);font-weight:600;letter-spacing:-.015em;
  margin:0 0 18px;display:grid;grid-template-columns:1.9em 1fr;gap:8px;align-items:baseline;
  text-wrap:balance;
}
h2.sec .num{color:var(--accent);font-size:.62em;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em}
h3{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:18px;font-weight:600;margin:34px 0 8px;letter-spacing:-.005em;
}
h4{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);margin:22px 0 6px;
}
.prose p{margin:0 0 14px}
.lede{font-size:18.5px;line-height:1.58}
.prose em{font-style:italic}

/* placeholder lines */
.todo{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:13px;color:var(--ink-faint);
  border:1px dashed var(--rule);border-radius:4px;
  padding:10px 13px;margin:8px 0 4px;background:var(--surface);
}
.todo::before{content:"To be written — ";color:var(--draft);font-weight:500}

/* ---------- figures ---------- */
.prose{counter-reset:figure}
figure{
  margin:26px 0;
  display:flex;flex-direction:column;gap:9px;
  break-inside:avoid;page-break-inside:avoid;
}
figure img{
  display:block;width:100%;height:auto;
  border:1px solid var(--rule);border-radius:3px;
  background:var(--surface);
}
figure.plate img{border:none;border-radius:0}
figcaption{
  counter-increment:figure;
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:13px;line-height:1.5;color:var(--ink-soft);
  max-width:62ch;
}
figcaption::before{
  content:"Figure " counter(figure) ". ";
  font-weight:600;color:var(--ink);
}
figcaption em{font-style:italic}
figcaption .scale{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;color:var(--ink-faint);
}
/* two panels side by side */
.figrow{
  display:grid;gap:20px;grid-template-columns:1fr;margin:26px 0;
}
@media (min-width:620px){.figrow{grid-template-columns:1fr 1fr}}
.figrow figure{margin:0}

/* ---------- channel table ---------- */
.channels{margin:16px 0 6px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13.5px}
caption{
  text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);padding-bottom:9px;font-weight:600;
}
th,td{text-align:left;padding:8px 14px 8px 0;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
th{font-weight:600;color:var(--ink-soft);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
td.nm{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
/* blank cells students fill in by hand */
td:empty{min-width:10ch}
td:empty::after{content:"";display:block;height:1.1em;border-bottom:1px solid var(--rule)}

/* ---------- print ---------- */
@media print{
  :root{
    --paper:#fff;--surface:#fff;--ink:#000;--ink-soft:#333;--ink-faint:#555;
    --rule:#bbb;--rule-soft:#ddd;--accent:#000;--draft:#444;--draft-soft:#fff;--shadow:none;
  }
  body{font-size:10.5pt;line-height:1.5}
  .shell{max-width:none;padding:0}
  .layout{display:block;margin-top:0}
  .contents{break-after:page;page-break-after:always;font-size:10pt;border:none}
  .contents ol ol{display:block}
  .prose{max-width:none}
  .prose > section{break-inside:auto}
  h2.sec,h3,h4{break-after:avoid;page-break-after:avoid}
  .todo{border-color:#ccc}
  td:empty::after{height:1.5em;border-bottom:1px solid #999}
  figure img{border-color:#999}
  figcaption{color:#222;font-size:9pt}
  .figrow{gap:12px}
  a{color:#000;text-decoration:none}
  .notice{border-left:2px solid #888}
  @page{margin:18mm 16mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">

<header class="masthead">
  <div>
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{HEADING}}</h1>
    <p class="sub">{{SUBTITLE}}</p>
  </div>
  <dl class="facts">
{{FACTS}}
  </dl>
</header>

{{NOTICE}}

<div class="layout">
  <nav class="contents" aria-label="Contents">
    <h2>Contents</h2>
{{TOC}}
  </nav>
  <main class="prose">
{{CONTENT}}
  </main>
</div>
</div>
</body>
</html>
